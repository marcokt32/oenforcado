    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fdf7"/>
      <stop offset=".6" stop-color="#d6f4e1"/>
      <stop offset="1" stop-color="#bfeacf"/>
    </linearGradient>
    <g id="estrela"><polygon fill="#ffc83d" stroke="#f0a500" stroke-width="3" stroke-linejoin="round" points="50,25 57.3,44.9 78.5,45.7 61.9,58.9 67.6,79.3 50,67.5 32.4,79.3 38.1,58.9 21.5,45.7 42.7,44.9"/></g>
    <g id="coracao"><path fill="#ff6fa5" stroke="#e0407f" stroke-width="3" stroke-linejoin="round" d="M50 82 C20 62 18 36 36 32 C44 30 50 36 50 42 C50 36 56 30 64 32 C82 36 80 62 50 82Z"/></g>
  </defs>

  <rect width="640" height="352" fill="url(#bg)"/>
  <circle cx="70" cy="52" r="90" fill="#fff" opacity=".35"/>
