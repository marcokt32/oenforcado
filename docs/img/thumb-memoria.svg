<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-label="Cartas do jogo da memória, algumas viradas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6edff"/>
      <stop offset="1" stop-color="#fde8f4"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c9dff"/>
      <stop offset=".55" stop-color="#2f7bf2"/>
      <stop offset="1" stop-color="#1a5fd1"/>
    </linearGradient>
    <linearGradient id="branco" x1="0" y1="0" x2="0" y2="1">
